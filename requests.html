    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="icon" type="image/x-icon" href="images/logo.jpg">

    <link rel="stylesheet" href="bfp-requests-style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-gradient-custom">
    <div class="sidebar">
        <a class="active" href="bfp-dashboard.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="requests.html">Requests</a>
        <a href="#about">About</a>
    </div>

    <nav class="navbar navbar-expand-sm navbar-light bg-white fixed-top shadow-sm">
        <div style="justify-content: left;" class="container-fluid">
            <a class="navbar-brand" href="#">
                <img class="logoimg" src="images/logo.jpg" alt="BFP Logo" style="height: 50px;">
            </a>
            <div class="font-weight-bold">Bureau of Fire Protection</div>

            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="#"><img style="margin-right: 15px;"
                            src="images/profile.png" alt=""> Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><img style="margin-right: 15px;" src="images/file.png"
                            alt="">Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html"><img style="margin-right: 15px;"
                            src="images/logout.png" alt="">Logout</a></li>
            </ul>
        </div>
    </nav>


    <main style="justify-content: center;" class="container-fluid content-wrapper">
        <br>
        <div class="container">
            <h2 style="text-align: center;" class="mb-4">Requests</h2>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div style="background-color: #F37021;" class="card-header text-white">
                            <h4 class="mb-0">Equipment Request Form</h4>
                        </div>
                        <div class="card-body">
                            <form action="mailto:admin.bfpr10@gmail.com" method="GET" enctype="text/plain">

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Personnel Name</label>
                            <input type="text" name="Requester_Name" class="form-control" placeholder="Enter full name"
                                required>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Rank/Position</label>
                            <input type="text" name="Rank" class="form-control" placeholder="e.g. FO1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Email Address</label>
                        <input type="email" name="Email" class="form-control" placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Equipment Category</label>
                        <select name="Equipment_Type" class="form-control" required>
                            <option value="" disabled selected>Select equipment...</option>
                            <option value="Firefighting Gear">Firefighting Gear (PPE, Helmets)</option>
                            <option value="Rescue Tools">Rescue Tools (Hose, Nozzles)</option>
                            <option value="Medical Supplies">Medical Supplies/First Aid</option>
                            <option value="Office Supplies">Office/Logistics Supplies</option>
                            <option value="Vehicle Parts">Vehicle Maintenance Parts</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Priority Level</label>
                        <div class="d-flex p-2 border rounded">
                            <div class="custom-control custom-radio mr-4">
                                <input type="radio" id="low" name="Priority" value="Low" class="custom-control-input">
                                <label class="custom-control-label" for="low">Low</label>
                            </div>
                            <div class="custom-control custom-radio mr-4">
                                <input type="radio" id="med" name="Priority" value="Medium" class="custom-control-input"
                                    checked>
                                <label class="custom-control-label" for="med">Medium</label>
                            </div>
                            <div class="custom-control custom-radio">
                                <input type="radio" id="high" name="Priority" value="High" class="custom-control-input">
                                <label class="custom-control-label" for="high">High</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Quantity & Description</label>
                        <textarea name="Details" class="form-control" rows="4"
                            placeholder="List items and quantities needed..."></textarea>
                    </div>

                            <button type="submit" class="btn btn-block font-weight-bold text-white shadow-sm"
                                style="background: linear-gradient(90deg, #FDB833, #F37021); border: none; padding: 12px; border-radius: 10px;">
                                SEND REQUEST TO GMAIL
                            </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 BFP Dashboard. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
